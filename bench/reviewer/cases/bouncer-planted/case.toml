error = "Eq. (5) treats the hard floor as a smooth turning point and uses the connection formula with phase pi/4, which holds only where the potential varies slowly on the scale of the wavelength. The floor is the opposite limit (an infinitely steep wall): the wave function must vanish there, which gives the phase pi/2 and the condition (n - 1/4) pi instead of (n + 1/2) pi. The claimed ground state, 1.771 in units of (hbar^2 m g^2/2)^(1/3), is 24% below the exact value 2.338 (first zero of the Airy function), while the correct WKB value 2.320 is within 1%; the error does not vanish for the low levels."
