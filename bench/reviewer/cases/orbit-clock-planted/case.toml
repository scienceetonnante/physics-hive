claim = 'A clock on a circular geodesic orbit at Schwarzschild radial coordinate $r$ around a mass $M$ runs, relative to the coordinate time $t$ (the proper time of static observers at infinity), at the rate $d\tau/dt = \sqrt{(1 - 2GM/(rc^2))(1 - GM/(rc^2))}$.'
problem = '''
# Problem

A clock moves freely on a circular orbit around a non-rotating spherical mass $M$, described by
the Schwarzschild metric. Find the rate $d\tau/dt$ of the clock relative to the coordinate time $t$,
as a function of the orbital radius $r$.

Definition of done: a closed-form expression valid at any radius where circular geodesic orbits
exist, not only in the weak-field limit.
'''
conventions = '''
# Conventions

Signature $(-,+,+,+)$. Schwarzschild coordinates $(t, r, \theta, \phi)$,
$ds^2 = -(1 - r_s/r)\,c^2 dt^2 + (1 - r_s/r)^{-1} dr^2 + r^2 d\Omega^2$ with $r_s = 2GM/c^2$.
$G$ and $c$ are kept explicit. $\tau$ is the proper time of the orbiting clock.
'''
error_kind = "unjustified assumption"
error = "Eq. (8) takes the speed of the clock relative to the static observer as r dphi/dt, the coordinate speed, instead of r dphi/dtau_s = r Omega / sqrt(1 - r_s/r). The result (11) is then wrong at second order in r_s/r: the weak-field check (12) still passes, but the rate does not vanish at r = 3GM/c^2, where circular orbits become null (it gives sqrt(2)/3 there). The correct rate, also obtained directly from the line element, is sqrt(1 - 3GM/(r c^2))."
location = "Eq. (8)"
severity = "breaks the result"
