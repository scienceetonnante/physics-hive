# Claude Code host configuration.
#
# The renderer reads this file to know where to write Claude Code's harness
# files, how to shape agent frontmatter, and how to map capabilities to tool
# names. Claude Code reads CLAUDE.md, which the renderer writes as a one-line
# import of the shared AGENTS.md.

name = "claude"
display_name = "Claude Code"
agents_dir = ".claude/agents"
agent_ext = ".md"
skills_dir = ".claude/skills"

# Claude skills accept `argument-hint:` in their frontmatter.
skill_argument_hint = true

# Heading prepended to each agent body. `{{name_cap}}` is the agent name with
# its first letter capitalised.
agent_body_prefix = "# {{name_cap}}\n\n"

# Agent frontmatter: which fields to emit, in order.
agent_frontmatter_order = ["name", "description", "tools"]

[tools_map]
file_read = "Read"
file_write = "Write"
file_edit = "Edit"
shell = "Bash"
glob = "Glob"
grep = "Grep"
web_search = "WebSearch"
web_fetch = "WebFetch"

[agent_extra_fields]

# File-backed values, loaded from hosts/claude/<filename> at render time.
# `section` is this harness's section of AGENTS.md.
[file_backed]
section = "section.md"
