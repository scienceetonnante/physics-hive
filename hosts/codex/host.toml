# Codex CLI host configuration.
#
# Codex differs from the other harnesses in two ways: sub-agent roles are TOML
# files (auto-discovered from .codex/agents/*.toml, no registration), and its
# tool surface collapses several capabilities onto shell_command and
# apply_patch (see section.md). Codex reads AGENTS.md and skills from
# .agents/skills/.

name = "codex"
display_name = "Codex CLI"
agents_dir = ".codex/agents"
agent_ext = ".toml"
skills_dir = ".agents/skills"

# Role files are TOML, not YAML + Markdown.
agent_format = "toml"

# tools_map documents which capability lands on which Codex tool. It is not
# emitted: Codex roles have no per-role tool allowlist (the sandbox is
# workspace-wide).
[tools_map]
file_read = "shell_command"      # via cat / head — no native read tool
file_write = "apply_patch"
file_edit = "apply_patch"
shell = "shell_command"
glob = "shell_command"           # via find / ls
grep = "shell_command"           # via grep / rg
web_search = "web_search"        # hosted tool, enabled in config.toml
web_fetch = "shell_command"      # via curl — no native fetch
literature = "mcp_servers.literature"  # the MCP server in .codex/config.toml

[file_backed]
section = "section.md"
