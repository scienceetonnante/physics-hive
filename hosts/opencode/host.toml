# OpenCode host configuration.
#
# OpenCode is close to Claude Code: agents are YAML-frontmatter Markdown,
# dispatch is the native `task` tool with `subagent_type`, and tool names
# match the method's generic references (read, write, edit, bash, glob, grep,
# webfetch, websearch). It reads AGENTS.md.
#
# Skills, not commands: OpenCode lists skills as slash commands, and it also
# reads .claude/skills/ and .agents/skills/, keeping the first copy of each
# name. Rendering OpenCode skills (rather than .opencode/commands/) and keeping
# skill bodies identical for every harness means a workspace rendered for
# several harnesses shows each skill once, with the same text whichever copy
# OpenCode picks.

name = "opencode"
display_name = "OpenCode"
agents_dir = ".opencode/agents"
agent_ext = ".md"
skills_dir = ".opencode/skills"

# OpenCode derives the agent name from the file name, so no `name:` field.
# Per-agent tool gating is not emitted; file ownership is enforced by the
# AGENTS.md prose and the role prompts. `mode: subagent` makes each role
# dispatchable with the task tool.
agent_frontmatter_order = ["description", "mode"]

[agent_extra_fields]
mode = "subagent"

# Documentation only (never emitted, since `tools` is not in the frontmatter
# order), but it must be complete because render_tools() is always called.
[tools_map]
file_read = "read"
file_write = "write"
file_edit = "edit"
shell = "bash"
glob = "glob"
grep = "grep"
web_search = "websearch"
web_fetch = "webfetch"

[file_backed]
section = "section.md"
