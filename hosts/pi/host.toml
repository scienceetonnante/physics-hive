# Pi host configuration.
#
# Pi discovers project skills in .pi/skills/ and prompt templates (slash
# commands) in .pi/prompts/, so everything Pi needs lives under .pi/ and no
# package.json or `pi install -l .` is required. Each skill is rendered as a
# thin stub under .pi/skills/<name>/SKILL.md plus the full workflow under
# .pi/prompts/<name>.md, with the Pi tool-discipline preamble prepended.

name = "pi"
display_name = "Pi"
agents_dir = ".pi/agents"
agent_ext = ".md"
skills_dir = ".pi/skills"
prompts_dir = ".pi/prompts"
skills_layout = "pi"

agent_frontmatter_order = ["name", "description", "thinking", "tools", "output"]

[tools_map]
file_read = "read"
file_write = "write"
file_edit = "edit"
shell = "bash"
# Pi's "glob" capability is the pair (ls, find).
glob = "ls, find"
grep = "grep"
web_search = "web_search"
web_fetch = "fetch_content"

[agent_extra_fields]
thinking = "high"

[file_backed]
preamble = "preamble.md"
section = "section.md"
skill_stub_template = "skill_stub.md.tmpl"
