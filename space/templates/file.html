{% extends "base.html" %}
{% block title %}{{ path }}{% endblock %}
{% block content %}
<div class="narrow">
  <p class="record-note">Session record · file</p>
  <div class="sheet">
    <div class="filebar"><div class="fleft"><span class="fname">{{ path }}</span></div></div>
    {% if header %}<details><summary class="label">Header</summary><pre>{{ header }}</pre></details>{% endif %}
    {% if body is not none %}<div class="md">{{ body | md }}</div>{% else %}<pre>{{ text }}</pre>{% endif %}
  </div>
</div>
{% endblock %}
